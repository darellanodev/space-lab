<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="./manifest.json" />
  <title>SpaceLab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #game { display: block; width: 100%; height: 100%; }
    #info { position: fixed; left: 8px; top: 8px; color: #7fdcff; font-size: 12px; pointer-events: none; white-space: pre; }
    #hud { position: fixed; right: 12px; top: 8px; color: #fff; font-size: 18px; text-shadow: 0 0 4px #000; pointer-events: none; }
    #message { display: none; position: fixed; left: 0; right: 0; top: 35%; text-align: center; color: #fff; font-size: 32px; white-space: pre; text-shadow: 0 0 8px #000; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="info"></div>
  <div id="hud"></div>
  <div id="message"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
