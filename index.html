<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="./manifest.json" />
  <title>SpaceLab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #game { display: block; width: 100%; height: 100%; }
    #info { position: fixed; left: 8px; top: 8px; color: #7fdcff; font-size: 12px; pointer-events: none; white-space: pre; }
    #hud { position: fixed; left: 24px; top: 20px; pointer-events: none; display: flex; gap: 30px; }
    #hud div { height: 62px; background-repeat: no-repeat; background-size: auto 100%; }
    #hud-lives { width: 301px; background-image: url(./textures/ui/hud/hud_hearts.png); }
    #hud-computers { position: relative; width: 242px; background-image: url(./textures/ui/hud/hud_computers_on.png); }
    #hud-computers-off { position: absolute; left: 0; top: 0; width: 242px; background-image: url(./textures/ui/hud/hud_computers_off.png); }
    #game-over { display: none; position: fixed; left: 50%; top: 200px; width: 598px; height: 79px; margin-left: -299px; background: url(./textures/ui/hud/game_over.png) no-repeat; pointer-events: none; }
    #message { display: none; position: fixed; left: 0; right: 0; top: 35%; text-align: center; color: #fff; font-size: 32px; white-space: pre; text-shadow: 0 0 8px #000; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="info"></div>
  <div id="hud"><div id="hud-lives"></div><div id="hud-computers"><div id="hud-computers-off"></div></div></div>
  <div id="game-over"></div>
  <div id="message"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
