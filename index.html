<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="./manifest.json" />
  <title>SpaceLab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #game { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; left: 24px; top: 20px; pointer-events: none; display: flex; gap: 30px; }
    #hud div { height: 62px; background-repeat: no-repeat; background-size: auto 100%; }
    #hud-lives { width: 301px; background-image: url(./textures/ui/hud/hud_hearts.png); }
    #hud-computers { position: relative; width: 242px; background-image: url(./textures/ui/hud/hud_computers_on.png); }
    #hud-computers-off { position: absolute; left: 0; top: 0; width: 242px; background-image: url(./textures/ui/hud/hud_computers_off.png); }
    #game-over { display: none; position: fixed; left: 50%; top: 20%; width: min(598px, 90vw); aspect-ratio: 598 / 79; transform: translateX(-50%); background: url(./textures/ui/hud/game_over.png) no-repeat; background-size: 100% 100%; pointer-events: none; }
    #message { display: none; position: fixed; left: 0; right: 0; top: 35%; text-align: center; color: #fff; font-size: 32px; white-space: pre; text-shadow: 0 0 8px #000; pointer-events: none; }
    #game, #hud, #message, #game-over { display: none; }
    body.playing #game { display: block; }
    body.playing #hud { display: flex; }
    #menu { display: none; position: fixed; left: 0; top: 0; width: var(--app-w, 100vw); height: var(--app-h, 100vh); background: #000; overflow: hidden; }
    #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(var(--app-w, 100vw), calc(var(--app-h, 100vh) * 16 / 9)); aspect-ratio: 16 / 9; background-size: 100% 100%; background-repeat: no-repeat; }
    .ui-item { position: absolute; user-select: none; -webkit-user-drag: none; }
    .ui-button { cursor: pointer; transition: transform 0.1s, filter 0.1s; }
    .ui-button:hover { transform: scale(1.04); filter: brightness(1.15); }
    .ui-level { outline: 0 solid #fff; }
    .ui-hint { position: absolute; left: 0; right: 0; bottom: 3%; text-align: center; color: #fff; opacity: 0.7; font-size: 14px; }
    .ui-loading { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: #fff; font-size: 40px; letter-spacing: 4px; }
    #loading { display: none; position: fixed; inset: 0; background: #000; color: #fff; z-index: 10; flex-direction: column; gap: 24px; align-items: center; justify-content: center; font-size: 40px; letter-spacing: 4px; }
    #loading-bar { width: min(420px, 70vw); height: 14px; border: 2px solid #fff; border-radius: 8px; padding: 2px; box-sizing: content-box; }
    #loading-fill { width: 0; height: 100%; background: #36a3d9; border-radius: 5px; transition: width 0.15s; }
    body.playing #loading { display: flex; }
    html, body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    @media (pointer: coarse) and (max-width: 900px) { #hud { transform: scale(0.6); transform-origin: top left; left: 12px; top: 8px; } }
    /* touch controls */
    #touch { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    #touch-zone { position: absolute; left: 0; top: 0; width: 50%; height: 100%; pointer-events: auto; }
    #touch-base { display: none; position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 3px solid rgba(255, 255, 255, 0.5); pointer-events: none; }
    #touch-thumb { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); transform: translate(-50%, -50%); }
    #touch-jump, #touch-exit { position: absolute; display: flex; align-items: center; justify-content: center; color: #fff; font: bold 14px monospace; border-radius: 50%; background: rgba(0, 120, 255, 0.45); border: 3px solid rgba(255, 255, 255, 0.6); pointer-events: auto; }
    #touch-jump { right: 28px; bottom: 28px; width: 96px; height: 96px; font-size: 18px; }
    #touch-exit { right: 12px; top: 8px; width: 52px; height: 52px; font-size: 11px; background: rgba(0, 0, 0, 0.4); }
    #touch .down { filter: brightness(1.6); }
    /* the game is played in landscape */
    #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #000; color: #fff; align-items: center; justify-content: center; text-align: center; font-size: 22px; padding: 24px; }
    @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
  </style>
  <script>
    // The real visible size. On phones "100vh" is taller than the visible page (browser bars), so we measure it.
    (function () {
      function fit() {
        var vv = window.visualViewport;
        var w = vv ? vv.width : window.innerWidth;
        var h = vv ? vv.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-w', w + 'px');
        document.documentElement.style.setProperty('--app-h', h + 'px');
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    })();
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><div id="hud-lives"></div><div id="hud-computers"><div id="hud-computers-off"></div></div></div>
  <div id="game-over"></div>
  <div id="menu"></div>
  <div id="rotate">Please turn your device to landscape</div>
  <div id="loading"><div id="loading-text">LOADING LEVEL</div><div id="loading-bar"><div id="loading-fill"></div></div></div>
  <div id="message"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
